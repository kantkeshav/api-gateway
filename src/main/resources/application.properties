spring.application.name=api-gateway
server.port=8082

# Requests matching /api/bookings/** go to port 8080. -> http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].id = booking-service
spring.cloud.gateway.server.webflux.routes[0].uri = lb://BOOKING-SERVICE                
spring.cloud.gateway.server.webflux.routes[0].predicates[0] = Path=/api/bookings/**

# Requests matching /api/flights/** go to port 8081.
spring.cloud.gateway.server.webflux.routes[1].id = flight-service
#spring.cloud.gateway.server.webflux.routes[1].uri = http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].uri = lb://FLIGHT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0] = Path=/api/flights/**

#This forwards login requests to Booking Service, where your existing login logic remains.
# Requests matching auth-service/** go to port 8081.
spring.cloud.gateway.server.webflux.routes[2].id = auth-service
spring.cloud.gateway.server.webflux.routes[2].uri = lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0] = Path=/api/auth/**



eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


